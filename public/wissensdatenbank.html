<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gnannt Wissensdatenbank</title><style>body{font:16px system-ui,Arial;background:#f7f7f7;color:#202124;margin:0}header{background:#a51e28;color:white;padding:22px max(20px,calc((100% - 1100px)/2))}main{max-width:1100px;margin:auto;padding:24px 16px}h1{margin:0;font-size:27px}p{line-height:1.5}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}input,select{padding:13px;border:1px solid #ccc;border-radius:8px;font:inherit;flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.card{background:white;border:1px solid #ddd;border-radius:12px;overflow:hidden}.card img{width:100%;aspect-ratio:16/9;object-fit:cover}.card div{padding:16px}.card h2{font-size:18px;margin:5px 0}.category{font-size:12px;color:#a51e28;font-weight:700}.card a{display:inline-block;margin-top:12px;background:#a51e28;color:white;padding:10px 14px;text-decoration:none;border-radius:7px}.notice{font-size:13px;color:#555}#status{margin:15px 0}</style></head><body><header><h1>GNANNT | Wissensdatenbank</h1><p>Montagewissen, Reparatur und Produktschulungen</p></header><main><p>Schulungsvideos für unsere Mitarbeiter. Bitte die jeweiligen Herstellervorgaben und Sicherheitsregeln beachten.</p><div class="toolbar"><input id="search" placeholder="Video suchen"><select id="category"><option value="">Alle Kategorien</option></select></div><p id="status">Videos werden geladen ...</p><div class="grid" id="grid"></div></main><script>const files=["altbau-sanierung-montage-aussenanschlag","ausglasen-video-3","fenstertausch-sanierung","gnannt-regio-tv","haustuer-einbauen","nebeneingangstuer-haustuer-einbauen","roma-pento-xp-vorbaurollladen","roma-puro-aufsatzrollladen-montage","video-xXm0uaBbx4w","vorbaurollladen-elektrisch-montieren","vorbaurollladen-panzer-austauschen"];let items=[];const grid=document.querySelector('#grid'),cat=document.querySelector('#category'),search=document.querySelector('#search');function render(){const q=search.value.toLowerCase(),c=cat.value;const filtered=items.filter(x=>(!c||x.category===c)&&(!q||(x.title+' '+x.category+' '+x.description).toLowerCase().includes(q)));grid.replaceChildren(...filtered.map(x=>{const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.src='https://i.ytimg.com/vi/'+encodeURIComponent(x.youtubeId)+'/hqdefault.jpg';img.alt='Videovorschau';img.loading='lazy';const body=document.createElement('div'),category=document.createElement('div'),h=document.createElement('h2'),p=document.createElement('p'),a=document.createElement('a');category.className='category';category.textContent=x.category;h.textContent=x.title;p.textContent=x.description||'';a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Video ansehen';body.append(category,h,p,a);if(x.verification&&/nicht|offen/i.test(x.verification)){const n=document.createElement('p');n.className='notice';n.textContent='Videoinhalt noch nicht unabhängig geprüft';body.append(n)}card.append(img,body);return card}));document.querySelector('#status').textContent=filtered.length+' von '+items.length+' Videos'}Promise.all(files.map(async f=>{try{const r=await fetch('/wissensdatenbank/'+f+'.json');return r.ok?await r.json():null}catch{return null}})).then(data=>{items=data.filter(Boolean);[...new Set(items.map(x=>x.category))].sort().forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;cat.append(o)});render()});search.addEventListener('input',render);cat.addEventListener('change',render);</script></body></html>
